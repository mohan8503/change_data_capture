apiVersion: v1
kind: ConfigMap
metadata:
  name: debezium
  labels:
    app: debezium
  namespace: debezium
data:
  application.properties: |-
      debezium.sink.type=pubsub
      debezium.sink.pubsub.project.id=climate-delta-dev
      debezium.source.connector.class=io.debezium.connector.sqlserver.SqlServerConnector
      debezium.source.offset.storage.file.filename=/tmp/offsets.dat
      debezium.source.offset.flush.interval.ms=0
      debezium.source.database.hostname=34.86.225.241
      debezium.source.database.port=1433
      debezium.source.database.user=sqlserver
      debezium.source.database.password=~B9bQa(o,d@cj6dh
      debezium.source.database.dbname=test
      debezium.source.database.server.name=debezium
      debezium.sink.pravega.scope=empty
      debezium.source.schema.include.list=dbo
      debezium.snapshot.new.tables=parallel
      debezium.source.database.history.file.filename=/tmp/FileDatabaseHistory.dat
      debezium.source.database.history=io.debezium.relational.history.FileDatabaseHistory
      debezium.transforms=Reroute
